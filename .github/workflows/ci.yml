name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm test
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python scripts/check_publication.py
      - run: python scripts/setup.py --device cpu --dry-run --non-interactive
      - if: runner.os == 'Windows'
        shell: cmd
        run: call setup.bat --device cpu --dry-run --non-interactive
      - if: runner.os == 'Linux'
        run: |
          bash -n setup.sh install-plugin.sh run_tts.sh scripts/python.sh
          bash setup.sh --device cpu --dry-run --non-interactive
  linux-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash setup.sh --device cpu --skip-assets --non-interactive
